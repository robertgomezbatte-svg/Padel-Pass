<!-- admin.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Padel Pass — Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#0b1020" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="Padel Pass" class="logo" />
      <span>Padel Pass</span>
    </a>

    <nav class="nav" id="siteNav">
      <a class="navlink" href="index.html">Inicio</a>
      <a class="navlink" href="pass.html">Pase</a>
      <a class="navlink" href="events.html">Eventos</a>
      <a class="navlink" href="players.html">Jugadores</a>
      <a class="navlink" href="register.html">Registro</a>
    </nav>

    <div class="topbar-actions">
      <button class="btn ghost nav-toggle" id="navToggle" type="button" aria-label="Abrir menú" aria-controls="siteNav" aria-expanded="false">☰</button>
      <button class="btn ghost" id="themeToggle" type="button">Modo</button>
    </div>
  </header>
  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <main class="wrap section">
    <div class="card">
      <div class="hd">
        <b>Admin (registros)</b>
        <div class="help">Lectura y borrado de registros en Firestore (demo)</div>
      </div>
      <div class="bd">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <button class="btn" id="adminReload" type="button">Recargar</button>
          <button class="btn ghost" id="adminClear" type="button">Borrar todo</button>
          <div id="adminOut"></div>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Handle</th>
                <th>Club</th>
                <th>Fecha</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      © <span id="year"></span> Padel Pass · MVP
    </div>
  </footer>

  <script>window.PADEL_PAGE="admin"</script>
  <script type="module" src="app.js"></script>
</body>
</html>
