<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Padel Pass — Confirmar</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <img src="assets/logo.svg" class="logo"/>
    <span>Padel Pass</span>
  </a>
</header>

<main class="container">

<section class="page-head">
<h1>Confirmar resultado</h1>
</section>

<section class="card">
<div class="card-body">

<form id="resultForm" class="form-grid">

<select class="input" name="winner" required>
<option value="">Ganador</option>
<option value="A">Pareja A</option>
<option value="B">Pareja B</option>
</select>

<input class="input" name="score" placeholder="6-4 6-3" required>

<div style="grid-column:1/-1;">
<button class="btn" type="submit">Guardar</button>
</div>

<div id="msg" class="muted small" style="grid-column:1/-1;"></div>

</form>

</div>
</section>

</main>

<script>

async function getPlayers(){
  const res=await fetch("./players.json");
  const base=await res.json();
  const local=JSON.parse(localStorage.getItem("pp_players_extra")||"[]");
  return [...base,...local];
}

document.getElementById("resultForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const match=JSON.parse(localStorage.getItem("pp_current_match"));
  if(!match)return;

  const players=await getPlayers();
  const winnerSide=e.target.winner.value;
  const score=e.target.score.value;

  const [p1,p2,p3,p4]=match.players;
  const teamA=[p1,p2];
  const teamB=[p3,p4];

  const winners=winnerSide==="A"?teamA:teamB;
  const losers=winnerSide==="A"?teamB:teamA;

  players.forEach(p=>{
    if(winners.includes(p.id)){
      p.points+=30;
      p.wins+=1;
    }
    if(losers.includes(p.id)){
      p.points+=10;
      p.losses+=1;
    }
  });

  localStorage.setItem("pp_players_extra",
    JSON.stringify(players.filter(p=>p.id.startsWith("local_")))
  );

  const matches=JSON.parse(localStorage.getItem("pp_matches_extra")||"[]");
  matches.push({
    id:match.id,
    datetime:new Date().toISOString(),
    players:match.players,
    winner:winners[0],
    score
  });
  localStorage.setItem("pp_matches_extra",JSON.stringify(matches));

  localStorage.removeItem("pp_current_match");

  document.getElementById("msg").innerText="Partido guardado y puntos sumados";
});

</script>

</body>
</html>
