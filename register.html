<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Padel Pass — Registro</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#0b1020" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/logo.svg" alt="Padel Pass" class="logo" />
      <span>Padel Pass</span>
    </a>

    <nav class="nav" id="siteNav">
      <a class="navlink" href="index.html">Inicio</a>
      <a class="navlink" href="pass.html">Pase</a>
      <a class="navlink" href="events.html">Eventos</a>
      <a class="navlink" href="players.html">Jugadores</a>
      <a class="navlink active" href="register.html">Registro</a>
    </nav>

    <div class="topbar-actions">
      <button class="btn ghost nav-toggle" id="navToggle" type="button" aria-label="Abrir menú" aria-controls="siteNav" aria-expanded="false">☰</button>
      <button class="btn ghost" id="themeToggle" type="button">Modo</button>
    </div>
  </header>
  <div class="nav-backdrop" id="navBackdrop" hidden></div>

  <main class="wrap section">
    <div class="card">
      <div class="hd">
        <b>Registro (demo)</b>
        <div class="help">Guarda registros en Firestore (anónimo)</div>
      </div>
      <div class="bd">
        <form id="registerForm">
          <div class="field">
            <label for="name">Nombre</label>
            <input id="name" name="name" placeholder="Tu nombre" />
          </div>
          <div class="field">
            <label for="handle">Handle (opcional)</label>
            <input id="handle" name="handle" placeholder="@nick" />
          </div>
          <div class="field">
            <label for="club">Club (opcional)</label>
            <input id="club" name="club" placeholder="Club" />
          </div>

          <button class="btn primary" type="submit">Registrar</button>
        </form>

        <div id="registerOut" style="margin-top:12px"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      © <span id="year"></span> Padel Pass · MVP
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
